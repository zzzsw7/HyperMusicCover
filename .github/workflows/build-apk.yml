name: Build APK (fork)

# 给 fork 用的构建：上游的 release.yml 限定 `github.repository == 'zyl6932/HyperMusicCover'`，
# fork 里跑不了；这个文件只做「编译 + 上传 APK」，不发布 Release、不改版本号。
#
# 用法：
#   1. 把仓库 fork 到自己账号，启用 Settings → Actions → Allow all actions
#   2. 推任何提交、打 tag，或在 Actions 页面手动 Run workflow
#   3. 构建完在该次运行的 Artifacts 里下载 HyperMusicCover-apk
#
# 签名：用仓库里自带的 ci/debug.keystore（标准 Android debug key），
# 这样每次 CI 构建签名一致，也能直接覆盖安装你本机现有的构建。
# 换成自己的正式 key：把 keystore 放到 ci/ 下，改 Build 步骤里那四个环境变量。
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 不用 android-actions/setup-android：它在非交互环境里会卡在 SDK 许可确认
      # （"Review licenses that have not been accepted (y/N)?" 读到 EOF 直接失败）。
      # 直接用 runner 预装的 cmdline-tools，把许可一次性喂给它。
      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --version || true
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # 缓存 Gradle 与依赖：首次约 6~10 分钟，之后通常 2~4 分钟。
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-


      - name: Build release
        env:
          # 仓库里自带的 ci/debug.keystore：保证每次 CI 构建的签名一致，
          # 也和你本机现有安装的签名相同 ⇒ 可以直接 `adb install -r` 覆盖升级。
          # 这是标准 Android debug key（alias=androiddebugkey / 口令 android），不含真实发布身份；
          # 要换成自己的正式 key，就在这里改成 secrets。
          SIGNING_STORE_FILE: ci/debug.keystore
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_ALIAS: androiddebugkey
          SIGNING_KEY_PASSWORD: android
          # 版本号随构建递增：900000 + 运行序号，保证每次都能覆盖安装上一次的 CI 包
          # （仓库的 build.gradle.kts 读 -PmcVersionCode / -PmcVersionName）
          MC_CODE: ${{ github.run_number }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PmcVersionCode=$((900000 + MC_CODE)) \
            -PmcVersionName="ci.$MC_CODE"

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: HyperMusicCover-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### 构建产物"
            echo ""
            echo "| 文件 | 大小 |"
            echo "|---|---|"
            for f in out/*.apk; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"
