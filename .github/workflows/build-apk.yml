name: Build APK (fork)

# 给 fork 用的构建：上游的 release.yml 限定 `github.repository == 'zyl6932/HyperMusicCover'`，
# fork 里跑不了；这个文件只做「编译 + 上传 APK」，不发布 Release、不改版本号。
#
# 用法：
#   1. 把仓库 fork 到自己账号，启用 Settings → Actions → Allow all actions
#   2. 推任何提交、打 tag，或在 Actions 页面手动 Run workflow
#   3. 构建完在该次运行的 Artifacts 里下载 HyperMusicCover-apk
#
# 签名：仓库的 build.gradle.kts 支持环境变量 SIGNING_STORE_FILE 等；不配置时按 debug 签名出包
# （能装、能跑，只是不能覆盖签名不同的正式版）。要正式签名就在仓库 Secrets 里加：
#   SIGNING_STORE_FILE_BASE64  keystore 的 base64（`base64 -w0 release.jks`）
#   SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 不用 android-actions/setup-android：它在非交互环境里会卡在 SDK 许可确认
      # （"Review licenses that have not been accepted (y/N)?" 读到 EOF 直接失败）。
      # 直接用 runner 预装的 cmdline-tools，把许可一次性喂给它。
      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --version || true
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # 缓存 Gradle 与依赖：首次约 6~10 分钟，之后通常 2~4 分钟。
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decode keystore (optional)
        if: ${{ env.SIGNING_STORE_FILE_BASE64 != '' }}
        env:
          SIGNING_STORE_FILE_BASE64: ${{ secrets.SIGNING_STORE_FILE_BASE64 }}
        run: |
          echo "$SIGNING_STORE_FILE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: HyperMusicCover-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### 构建产物"
            echo ""
            echo "| 文件 | 大小 |"
            echo "|---|---|"
            for f in out/*.apk; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"
